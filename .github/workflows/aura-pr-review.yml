name: Aura PM — PR Intelligence

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out pull request merge commit
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch base and pull request refs
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          git fetch --no-tags origin "+refs/pull/$PR_NUMBER/head:refs/remotes/origin/aura-pr-$PR_NUMBER"

      - name: Run Aura PM review
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/aura/pr-review.md
          output-file: aura-review.md
          permission-profile: ":read-only"
          safety-strategy: drop-sudo
